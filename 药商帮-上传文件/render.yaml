# ============================================================
# 药商帮平台服务端 · Render Blueprint（免费托管一键配置）
# 使用方法：在 Render 网页上 New → Blueprint，或直接
# 在 render.com 控制台 New → Web Service 手动配置（见 README）
# ============================================================
services:
  - type: web
    name: yaoshangbang-api
    runtime: python
    plan: free
    buildCommand: ""
    startCommand: bash start.sh
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: ALLOW_ORIGIN
        value: https://4kr6wnmg5r83z.doubaoapps.com
